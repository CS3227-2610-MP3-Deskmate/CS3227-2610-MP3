{% extends "deskmate/base.html" %}
{% block content %}
  <p>Signed in as {{ username }}.</p>
  {% if title == "Support Officer" %}
    <p><a href="{% url 'article-list' %}">Knowledge base</a></p>
  {% elif title == "Requester" %}
    <p><a href="{% url 'article-read-list' %}">Knowledge base</a></p>
  {% endif %}
  <form method="post" action="{% url 'sign-out' %}">
    {% csrf_token %}
    <button type="submit">Sign out</button>
  </form>
{% endblock %}
