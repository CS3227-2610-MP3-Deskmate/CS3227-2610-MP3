{% extends "deskmate/base.html" %}
{% block content %}
  {% if form.errors %}
  <p id="{{ form.error_id }}">Incorrect username or password.</p>
  {% endif %}
  <form method="post" action="{% url 'sign-in' %}">
    {% csrf_token %}
    <label for="{{ form.username.id_for_label }}">Username</label>
    {{ form.username }}
    <label for="{{ form.password.id_for_label }}">Password</label>
    {{ form.password }}
    <button type="submit">Sign in</button>
  </form>
  <p>No account? Create a demo workspace with 2 Requesters and 1 Support Officer.</p>
  <form method="post" action="{% url 'demo-workspace' %}">
    {% csrf_token %}
    <button type="submit">Create demo workspace</button>
  </form>
{% endblock %}
