# Local development only: runs PostgreSQL, reading its database name, user and
# password from the developer's .env (copied from .env.example).
services:
  db:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to loopback so only this machine can connect.
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/docker,
      # so the volume is mounted on the parent directory.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Checks over TCP, which the server only opens once initialisation is done.
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
