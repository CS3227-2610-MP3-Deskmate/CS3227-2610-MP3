[pytest]
# Deskmate's tests live in tests/ folders beside the code under src/; the
# workflow's own tests are the unittest-style test_*.py in workflow/scripts.
testpaths = src workflow/scripts
pythonpath = src
# The Django settings the tests use: Deskmate's own, configured from values
# committed with the tests instead of the developer's shell (TECHNICAL-SPEC
# "Environments"). Given as --ds because pytest-django prefers a shell's
# DJANGO_SETTINGS_MODULE to an ini setting.
addopts = --ds=deskmate.tests.settings
django_find_project = false
strict_config = true
strict_markers = true
markers =
    ac(*ids): the acceptance criteria a test checks, by spec ID, such as ac("PLT-1.2")
